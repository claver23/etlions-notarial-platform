<header class="sticky top-0 z-30 border-b border-[var(--color-sand-100)] bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
    <a routerLink="/" class="flex items-center gap-2.5" aria-label="ETLIONS NOTARIAL, ir al inicio">
      <img src="assets/brand/logo-icon.png" alt="" class="h-9 w-9" width="36" height="36" />
      <span class="text-lg font-extrabold tracking-tight text-[var(--color-navy-900)]">
        ET<span class="text-[var(--color-coral-500)]">LIONS</span>
      </span>
    </a>

    <nav class="hidden items-center gap-1 sm:flex" aria-label="Navegación principal">
      <a
        routerLink="/"
        routerLinkActive="bg-[var(--color-sand-100)] text-[var(--color-navy-900)]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-3 py-2 text-sm font-semibold text-[var(--color-ink-500)] transition hover:text-[var(--color-navy-900)]"
        >Trámites</a
      >
      <a
        routerLink="/mis-tramites"
        routerLinkActive="bg-[var(--color-sand-100)] text-[var(--color-navy-900)]"
        class="rounded-lg px-3 py-2 text-sm font-semibold text-[var(--color-ink-500)] transition hover:text-[var(--color-navy-900)]"
        >Mis trámites</a
      >
    </nav>

    <div class="flex items-center gap-2">
      <a
        routerLink="/mis-tramites"
        class="hidden rounded-full bg-[var(--color-coral-500)] px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-[var(--color-coral-600)] sm:inline-flex"
      >
        Mis trámites
      </a>
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-[var(--color-navy-900)] sm:hidden"
        (click)="menuAbierto.set(!menuAbierto())"
        [attr.aria-expanded]="menuAbierto()"
        aria-label="Abrir menú"
      >
        <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
      </button>
    </div>
  </div>

  @if (menuAbierto()) {
    <nav class="flex flex-col gap-1 border-t border-[var(--color-sand-100)] px-5 py-3 sm:hidden" aria-label="Navegación móvil">
      <a routerLink="/" (click)="menuAbierto.set(false)" class="rounded-lg px-3 py-2.5 text-sm font-semibold text-[var(--color-ink-700)]">Catálogo de trámites</a>
      <a routerLink="/mis-tramites" (click)="menuAbierto.set(false)" class="rounded-lg px-3 py-2.5 text-sm font-semibold text-[var(--color-ink-700)]">Mis trámites</a>
    </nav>
  }
</header>
